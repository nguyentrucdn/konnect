name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Deploy signaling service
        id: signal
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: signal
          wranglerVersion: "4"
      - name: Check TURN secret configuration
        id: turn
        env:
          METERED_TURN_APP: ${{ secrets.METERED_TURN_APP }}
          METERED_TURN_API_KEY: ${{ secrets.METERED_TURN_API_KEY }}
        run: |
          if [ -n "$METERED_TURN_APP" ] && [ -n "$METERED_TURN_API_KEY" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Configure TURN credentials
        if: steps.turn.outputs.configured == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          METERED_TURN_APP: ${{ secrets.METERED_TURN_APP }}
          METERED_TURN_API_KEY: ${{ secrets.METERED_TURN_API_KEY }}
        run: |
          printf '%s' "$METERED_TURN_APP" | npx wrangler@4 secret put METERED_TURN_APP --config signal/wrangler.jsonc
          printf '%s' "$METERED_TURN_API_KEY" | npx wrangler@4 secret put METERED_TURN_API_KEY --config signal/wrangler.jsonc
      - name: Configure signaling endpoint
        env:
          SIGNAL_SERVER_URL: ${{ steps.signal.outputs.deployment-url }}
        run: |
          node -e 'const fs = require("node:fs"); const url = new URL(process.env.SIGNAL_SERVER_URL); if (url.protocol !== "https:") throw new Error("Cloudflare did not return an HTTPS Worker URL"); fs.writeFileSync("signal-config.js", `window.KONNECT_SIGNAL_URL = ${JSON.stringify(url.toString())};\n`);'
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
